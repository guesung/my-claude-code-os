# 리뷰 원장 (실행층) v0
#
# 적립층은 노션 "코드 리뷰 문서화 DB". 여기에는 그중 리뷰어·검사기가 실제로 판정할 항목만 둔다.
# 한 항목 = "다시는 지적받지 않겠다"는 규칙 하나. 검증 가능한 형태로만 적는다.
#
# 검증.type
#   grep      — 검사기(/ledger-check)가 기계로 판정. 발견 즉시 FAIL
#   judgment  — 기계 판정 불가. 리뷰어 에이전트에게 판정 기준으로 전달
#   ast       — ast-grep 패턴. v0에서는 예약만
# 검증.scope (grep 전용)
#   added     — diff의 추가 라인
#   filename  — diff의 변경 파일명
# 재발 — 최종 리뷰에서 사람이 같은 걸 다시 지적하면 +1. 4주차 채점 지표

# ───────────────────────── grep (검사기) ─────────────────────────

- id: L-001
  규칙: useCallback / useMemo 를 습관적으로 붙이지 않는다
  출처: ~/.claude/CLAUDE.md 핵심 규칙 9
  검증:
    type: grep
    scope: added
    pattern: '\b(useCallback|useMemo)\('
    glob: '**/*.{ts,tsx}'
  중요도: 높음
  재발: 0

- id: L-002
  규칙: 테스트 코드는 작성하지 않는다 (팀이 유지하지 않으므로 런타임 검증으로 대체)
  출처: https://app.notion.com/3c1a054b7d8281c7a4d5da5f43881362
  검증:
    type: grep
    scope: filename
    pattern: '\.(test|spec)\.[jt]sx?$'
  중요도: 높음
  재발: 0

- id: L-003
  규칙: 외부 fetch는 직접 호출하지 않고 공통 fetchClient를 쓴다
  출처: https://app.notion.com/3c7a054b7d8281eb82f0c6af67579566
  검증:
    type: grep
    scope: added
    pattern: '\bfetch\('
    glob: '**/*.{ts,tsx,astro}'
    exclude: '**/fetchClient.ts'
  중요도: 보통
  재발: 0

- id: L-004
  규칙: 인라인 svg를 마크업에 쓰지 않고 파일로 분리해 import한다
  출처: https://app.notion.com/3c7a054b7d8281d48dc4cad666b18c0e
  검증:
    type: grep
    scope: added
    pattern: '<svg\b'
    glob: '**/*.{tsx,astro}'
  중요도: 보통
  재발: 0

- id: L-005
  규칙: Tailwind 임의값(`text-[15.5px]`, `pb-[1.3rem]`) 대신 기본 스케일을 쓴다
  출처: https://app.notion.com/3c7a054b7d8281f2b5aaeedee2b1f4ab
  검증:
    type: grep
    scope: added
    pattern: '-\[[0-9.]+(px|rem)\]'
    glob: '**/*.{tsx,astro}'
  중요도: 낮음
  재발: 0

- id: L-006
  규칙: 레거시 손 CSS를 is:global로 통째로 옮기지 않고 Tailwind로 다시 쓴다
  출처: https://app.notion.com/3c7a054b7d8281549978f287dc61dc4f
  검증:
    type: grep
    scope: added
    pattern: 'is:global'
    glob: '**/*.astro'
  중요도: 보통
  재발: 0

- id: L-007
  규칙: 모든 export 대상(함수·타입·상수·컴포넌트)에 JSDoc을 단다
  출처: https://app.notion.com/3c7a054b7d8281bea7f3c4a0f70a4992
  검증:
    type: grep
    scope: added
    pattern: '^export\s'
    unless_previous_line: '^\s*\*/'
    glob: '**/*.{ts,tsx}'
  중요도: 높음
  재발: 0

# ───────────────────────── judgment (리뷰어) ─────────────────────────

- id: L-101
  규칙: 이름은 구체적으로 짓는다. 길어져도 무엇에 대한 값인지 이름만으로 드러나야 한다
  출처: https://app.notion.com/3c1a054b7d828197acbee6793cbef02e
  검증:
    type: judgment
    판정 기준: >-
      변경분의 식별자 중 `data`, `item`, `isOpen`, `handleClick`처럼 대상이 생략된 이름이 있으면 FAIL. `isErrorModalOpen`, `handleSubmitButtonClick` 수준을 요구한다
  중요도: 높음
  재발: 0

- id: L-102
  규칙: 외부 API 호출은 HTTP 상태와 응답 본문의 ok를 둘 다 확인한다
  출처: https://app.notion.com/3c2a054b7d8281b8b180f03135580235
  검증:
    type: judgment
    판정 기준: >-
      외부 API 응답을 다루는 코드가 `response.ok`(HTTP)만 보거나 본문의 `ok: false`만 보면 FAIL. 실패를 예외로 바꾸지 않아 로그가 남지 않는 구조도 FAIL
  중요도: 높음
  재발: 0

- id: L-103
  규칙: 한 곳에서만 쓰는 값·클래스 문자열·고정 URL은 상수나 인자로 빼지 않고 사용처에 인라인한다
  출처: https://app.notion.com/3c9a054b7d8281488b74dfa0c6930b2c, https://app.notion.com/3c6a054b7d82810c8d40cd523d90ef4d, ~/.claude/CLAUDE.md 핵심 규칙 10
  검증:
    type: judgment
    판정 기준: >-
      새로 추가된 상수·props·인자의 사용처가 변경분 안에서 1곳뿐이면 FAIL. 운영 환경에 따라 바뀌는 값(채널·대상자·주소)은 예외
  중요도: 보통
  재발: 0

- id: L-104
  규칙: common(공유 폴더)에는 둘 이상의 사용처가 공유하는 모듈만 둔다
  출처: https://app.notion.com/3c6a054b7d8281928cdbfe8683a178f6
  검증:
    type: judgment
    판정 기준: >-
      `common/`, `shared/`, `utils/` 아래에 새로 추가된 모듈의 import 지점이 1곳이면 FAIL. 자식이 하나뿐인 상위 계층(`features/` 아래 폴더 1개)도 FAIL
  중요도: 보통
  재발: 0

- id: L-105
  규칙: 검증 실패는 `{ isValid, reason }` 같은 결과 객체 대신 사유를 담은 예외로 던지고, 진입점에서 잡아 변환한다
  출처: https://app.notion.com/3c6a054b7d8281e4aa2fd9727d9301f1
  검증:
    type: judgment
    판정 기준: >-
      검증 함수가 boolean 필드를 가진 객체를 반환하고 호출부가 그 필드로 분기하면 FAIL
  중요도: 보통
  재발: 0

- id: L-106
  규칙: 비밀값이 아닌 설정(채널 ID·페이지 URL·리전)은 환경변수 대신 코드 상수로 둔다
  출처: https://app.notion.com/3c6a054b7d8281d28753dd5b05ceaf0e
  검증:
    type: judgment
    판정 기준: >-
      새로 추가된 `process.env.*` / `import.meta.env.*` 참조가 토큰·시크릿이 아니면 FAIL
  중요도: 보통
  재발: 0
